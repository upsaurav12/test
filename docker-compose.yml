services:
  psql_bp:
    image: postgres:16.3
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GONE_DB_DATABASE}
      POSTGRES_USER: ${GONE_DB_USERNAME}
      POSTGRES_PASSWORD: ${GONE_DB_PASSWORD}
    ports:
      - "${GONE_DB_PORT}:5432"
    volumes:
      - psql_volume_bp:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GONE_DB_USERNAME} -d ${GONE_DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  psql_volume_bp: